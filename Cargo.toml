[package]
name = "icloud-for-linux"
version = "0.4.0"
edition = "2021"
authors = ["einyx"]
description = "Mount iCloud Drive on Linux as a local-first FUSE filesystem with persistent caching and sync"
license = "GPL-3.0-only"
repository = "https://github.com/einyx/icloud-for-linux"
readme = "README.md"
keywords = ["icloud", "fuse", "linux", "sync", "filesystem"]

[lib]
name = "icloud_for_linux"
path = "src/lib.rs"

[[bin]]
name = "icloudctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
base64 = "0.22"
num-bigint = "0.4"
num-traits = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Pure-Rust FUSE: no libfuse headers required, talks to /dev/fuse directly.
fuser = { version = "0.14", default-features = false }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
parking_lot = "0.12"
shellexpand = "3"

# The HTTP stack for the iCloud protocol client is added with that client
# (see docs/ROADMAP.md, milestone M1) so the tree stays free of unused
# dependencies until it is actually needed.
[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
