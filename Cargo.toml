[package]
name = "icloud-for-linux"
version = "0.1.0"
edition = "2021"
authors = ["einyx"]
description = "Mount iCloud Drive on Linux as a local-first FUSE filesystem with persistent caching and sync"
license = "GPL-3.0-only"
repository = "https://github.com/einyx/icloud-for-linux"
readme = "README.md"
keywords = ["icloud", "fuse", "linux", "sync", "filesystem"]

[lib]
name = "icloud_for_linux"
path = "src/lib.rs"

[[bin]]
name = "icloudctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "signal", "process", "io-util", "sync"] }
reqwest = { version = "0.12", features = ["json", "cookies", "stream", "rustls-tls"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
# Pure-Rust FUSE: no libfuse headers required, talks to /dev/fuse directly.
fuser = { version = "0.14", default-features = false }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
nix = { version = "0.29", features = ["signal", "fs", "user"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
shellexpand = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
