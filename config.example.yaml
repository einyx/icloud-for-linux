# Configuration file template (save as ~/.config/icloud-for-linux/config.yaml)
---
# iCloud credentials
# NOTE: iCloud authentication requires your Apple ID account password.
username: "your_apple_id@example.com"
password: "your_apple_id_password"

# Root of the local store: blobs, staging area, path index and journal.
cache_dir: "~/.cache/icloud-for-linux"

# Where the session cookies are kept.
cookie_dir: "~/.config/icloud-for-linux/cookies"

# How long cached metadata stays valid before it is re-checked with the
# remote. Only stale entries are refreshed, so the cost of a refresh pass
# follows your activity instead of the size of the drive.
index_ttl_seconds: 300

# How file content is fetched.
#   lazy      — download a file the first time it is opened
#   background — keep eligible files downloaded ahead of time
hydration: "lazy"

# How many files may be downloaded ahead of time at once. iCloud throttles
# aggressive parallel downloads, and a throttled account is a locked account.
hydration_workers: 1

# What happens when a path changed both locally and remotely.
#   keep-local  — preserve the local version as a blob in the local store
#   keep-remote — accept the remote version
conflict_policy: "keep-local"

# Seconds between drain passes (apply the journal to the remote).
upload_interval_seconds: 30

# Seconds between metadata refresh passes.
remote_refresh_interval_seconds: 300

# Run the background loops.
#   true  — drain and refresh run automatically
#   false — nothing runs in the background; `icloudctl sync` drives a pass
auto_sync: true

# Allow-list: only these paths may be hydrated or modified.
# Empty or omitted means unrestricted.
# sync_paths:
#   - /Downloads

# Deny-list: these paths are never hydrated or modified, even when they are
# inside an allowed path. The deny-list is evaluated first.
# exclude_paths:
#   - /Downloads/Large Archive

# FUSE options
fuse_options:
  allow_other: false  # set to true to allow other users to access the mount
  ro: false           # set to true for read-only access
  nonempty: true      # allow mounting over a non-empty directory
